# database initialization
database=mysql
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

spring.datasource.driver-class-name=${MYSQL_SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.url=${MYSQL_SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/springblog_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${MYSQL_SPRING_DATASOURCE_PASSWORD:root_password}

# SQL is written to be idempotent, so we can run it on startup without worrying about duplicates
spring.sql.init.mode=always 